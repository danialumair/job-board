name: Auto-generate Job Manifest

on:
  push:
    paths:
      - 'jobs_*.json'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate manifest.json
        run: |
          jq -n '[inputs | select(test("jobs_.*\\.json$"))]' < <(ls jobs_*.json) > manifest.json
          git config --global user.name "GitHub Action"
          git config --global user.email "action@github.com"
          git add manifest.json
          git commit -m "Auto-update job manifest" || exit 0
          git push
