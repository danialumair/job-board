<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Job Board | Instant WhatsApp Apply</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-8 px-4 shadow-md text-center">
        <h1 class="text-3xl font-bold mb-2">🚀 Latest Verified Tech & Telecom Jobs</h1>
        <p class="text-indigo-100 max-w-xl mx-auto text-sm">Search roles, filter by domain/location, and apply instantly.</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        
        <!-- Search & Filter Bar -->
        <div class="flex flex-col md:flex-row gap-3 mb-6">
            <input type="text" id="searchInput" placeholder="Search by title, skill, or company..." 
                class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            
            <select id="domainFilter" class="px-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <option value="">All Domains</option>
                <option value="Telecom">Telecom</option>
                <option value="Cybersecurity">Cybersecurity</option>
                <option value="Cloud">Cloud & DevOps</option>
                <option value="IT">IT & Tech</option>
            </select>
        </div>

        <!-- Job Cards Grid -->
        <div id="jobListings" class="space-y-4">
            <!-- Dynamic Jobs Injected Here -->
        </div>

    </main>

    <!-- JavaScript to Load Data & Handle Search -->
    <script>
        let jobs = [];

        async function loadJobs() {
            try {
                const response = await fetch('jobs.json');
                jobs = await response.json();
                displayJobs(jobs);
            } catch (error) {
                console.error('Error loading jobs:', error);
            }
        }

        function displayJobs(jobArray) {
            const container = document.getElementById('jobListings');
            container.innerHTML = '';

            if (jobArray.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-8">No matching jobs found.</p>`;
                return;
            }

            jobArray.forEach(job => {
                // WhatsApp direct apply link generator
                const whatsappMsg = encodeURIComponent(`Hi, I am interested in applying for the ${job>title} position at ${job.company}. Here is my CV:`);
                const whatsappLink = `https://wa.me/?text=${whatsappMsg}`; // Or replace with your recruiter WhatsApp number like https://wa.me/968XXXXXXXX
                const emailLink = `mailto:${job.email}?subject=Application for ${job.title}&body=Hi,%0D%0A%0D%0AI would like to apply for the ${job.title} position.%0D%0A%0D%0ABest regards,`;

                const card = `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div>
                                <h2 class="text-lg font-bold text-gray-900">${job.title}</h2>
                                <p class="text-sm font-medium text-indigo-600">${job.company}</p>
                            </div>
                            <span class="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full">${job.domain}</span>
                        </div>
                        <div class="flex items-center gap-4 text-xs text-gray-500 mb-3">
                            <span class="flex items-center gap-1">📍 ${job.location}</span>
                        </div>
                        <p class="text-sm text-gray-600 mb-4 line-clamp-2">${job.description}</p>
                        
                        <div class="flex flex-wrap items-center gap-2 pt-3 border-t border-gray-100">
                            <a href="${emailLink}" class="flex-1 text-center bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-colors">
                                Apply via Email
                            </a>
                            <a href="${whatsappLink}" target="_blank" class="flex-1 text-center bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-semibold py-2.5 px-4 rounded-xl transition-colors">
                                Apply via WhatsApp
                            </a>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Search & Filter Logic
        document.getElementById('searchInput').addEventListener('input', filterJobs);
        document.getElementById('domainFilter').addEventListener('change', filterJobs);

        function filterJobs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const domain = document.getElementById('domainFilter').value;

            const filtered = jobs.filter(job => {
                const matchesQuery = job.title.toLowerCase().includes(query) || 
                                     job.company.toLowerCase().includes(query) || 
                                     job.location.toLowerCase().includes(query);
                const matchesDomain = domain === "" || job.domain.includes(domain);
                return matchesQuery && matchesDomain;
            });

            displayJobs(filtered);
        }

        loadJobs();
    </script>
</body>
</html>
