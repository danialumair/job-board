<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Global Job Portal | External Fetch</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <!-- Header -->
    <header class="bg-indigo-600 text-white py-8 px-4 shadow-md text-center">
        <h1 class="text-3xl font-bold mb-2">🚀 Verified Job Openings</h1>
        <p class="text-indigo-100 max-w-xl mx-auto text-sm">Dynamically loaded from JSON files, searchable, with full post details.</p>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6">
        
        <!-- Search & Filter Bar -->
        <div class="flex flex-col md:flex-row gap-3 mb-6">
            <input type="text" id="searchInput" placeholder="Search title, skills, location, company..." 
                class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
            
            <select id="domainFilter" class="px-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <option value="">All Domains</option>
                <option value="Telecom">Telecom</option>
                <option value="Cybersecurity">Cybersecurity</option>
                <option value="Cloud">Cloud & DevOps</option>
                <option value="IT">IT & Tech</option>
                <option value="Oil & Gas">Oil & Gas / Energy</option>
                <option value="Fintech">Fintech & Banking</option>
                <option value="Networking">Networking / IT Infrastructure</option>
            </select>
        </div>

        <!-- Job Cards List -->
        <div id="jobListings" class="space-y-4">
            <p class="text-center text-gray-500 py-8">Loading job listings from server...</p>
        </div>

    </main>

    <script>
        let allJobs = [];

        async function loadJobsFromFiles() {
            try {
                // 1. Fetch manifest file
                const manifestRes = await fetch('manifest.json');
                if (!manifestRes.ok) throw new Error('Could not load manifest.json');
                const fileList = await manifestRes.json();

                let combinedJobs = [];

                // 2. Fetch each JSON file listed in the manifest concurrently
                const fetchPromises = fileList.map(async (fileName) => {
                    try {
                        const res = await fetch(fileName);
                        if (!res.ok) return [];
                        const data = await res.json();
                        
                        // Extract date from filename if not present in job object
                        const dateMatch = fileName.match(/\d{4}-\d{2}-\d{2}/);
                        const fileDate = dateMatch ? dateMatch[0] : 'Recently';

                        return data.map((job, idx) => ({
                            ...job,
                            unique_id: `${fileName}_${idx}`,
                            posted_date: job.posted_date || fileDate
                        }));
                    } catch (err) {
                        console.error(`Error loading ${fileName}:`, err);
                        return [];
                    }
                });

                const results = await Promise.all(fetchPromises);
                results.forEach(jobArray => combinedJobs.push(...jobArray));

                // Sort by Newest Posted Date
                combinedJobs.sort((a, b) => new Date(b.posted_date) - new Date(a.posted_date));

                allJobs = combinedJobs;
                displayJobs(allJobs);

            } catch (error) {
                console.error('Fetch error:', error);
                document.getElementById('jobListings').innerHTML = `
                    <div class="bg-red-50 border border-red-200 text-red-700 p-4 rounded-xl text-center text-sm">
                        <p class="font-bold mb-1">Failed to fetch job files.</p>
                        <p>Make sure you are running this via a local server (like VS Code Live Server) or hosted on GitHub Pages so browser CORS permits external fetching.</p>
                    </div>`;
            }
        }

        function displayJobs(jobArray) {
            const container = document.getElementById('jobListings');
            container.innerHTML = '';

            if (!jobArray || jobArray.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-8">No matching jobs found.</p>`;
                return;
            }

            jobArray.forEach((job) => {
                const title = job.title || 'Job Opportunity';
                const company = job.company || 'Direct Hiring';
                const domain = job.domain || 'General';
                const location = job.location || 'Not Specified';
                const description = job.description || job.full_post_content || '';
                const email = job.email || 'No email provided';
                const postedDate = job.posted_date || 'Recently';
                const cardId = job.unique_id.replace(/[^a-zA-Z0-9]/g, '_');

                const emailLink = `mailto:${email}?subject=${encodeURIComponent('Application for ' + title)}&body=${encodeURIComponent('Hi,\n\nI would like to apply for the ' + title + ' position.\n\nBest regards,')}`;

                const card = `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div>
                                <h2 class="text-lg font-bold text-gray-900">${title}</h2>
                            </div>
                            <div class="flex flex-col items-end gap-1">
                                <span class="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full">${domain}</span>
                                <span class="text-[11px] text-gray-400 font-medium">📅 ${postedDate}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-4 text-xs text-gray-500 mb-3">
                            <span>📍 ${location}</span>
                            <span>✉️ ${email}</span>
                        </div>
                        
                        <!-- Description with Read More / Read Less Toggle -->
                        <div class="relative">
                            <p id="desc_${cardId}" class="text-sm text-gray-600 mb-2 line-clamp-3 transition-all duration-300">
                                ${description}
                            </p>
                            <button onclick="toggleReadMore('${cardId}')" id="btn_${cardId}" class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 mb-4 focus:outline-none">
                                Read More ↓
                            </button>
                        </div>
                        <div class="pt-3 border-t border-gray-100 flex items-center justify-between gap-2">
                            <button onclick="copyJobPost('${title.replace(/'/g, "\\'")}', '${company.replace(/'/g, "\\'")}', '${location.replace(/'/g, "\\'")}', '${domain}', '${email}', '${description.replace(/'/g, "\\'").replace(/\n/g, ' ')}')" 
                                class="bg-gray-100 hover:bg-gray-200 text-gray-700 text-xs font-semibold py-2.5 px-4 rounded-xl transition-colors">
                                📋 Copy Post
                            </button>
                            <a href="${emailLink}" class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2.5 px-6 rounded-xl transition-colors">
                                Apply via Email
                            </a>
                        </div>
                       
                    </div>
                `;
                container.innerHTML += card;
            });
        }

        // Toggle Expand / Collapse Full Description
        function toggleReadMore(cardId) {
            const descElem = document.getElementById(`desc_${cardId}`);
            const btnElem = document.getElementById(`btn_${cardId}`);

            if (descElem.classList.contains('line-clamp-3')) {
                descElem.classList.remove('line-clamp-3');
                btnElem.textContent = 'Read Less ↑';
            } else {
                descElem.classList.add('line-clamp-3');
                btnElem.textContent = 'Read More ↓';
            }
        }

        // Live Search & Filter Logic
        document.getElementById('searchInput').addEventListener('input', filterJobs);
        document.getElementById('domainFilter').addEventListener('change', filterJobs);

        function filterJobs() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const domain = document.getElementById('domainFilter').value;

            const filtered = allJobs.filter(job => {
                const matchesQuery = (job.title || '').toLowerCase().includes(query) || 
                                     (job.location || '').toLowerCase().includes(query) || 
                                     (job.description || '').toLowerCase().includes(query) ||
                                     (job.company || '').toLowerCase().includes(query);
                const matchesDomain = domain === "" || (job.domain || '').includes(domain);
                return matchesQuery && matchesDomain;
            });

            displayJobs(filtered);
        }

        // Run fetch on load
        loadJobsFromFiles();
        // Copy Job Post to Clipboard
        function copyJobPost(title, company, location, domain, email, description) {
            const textToCopy = `Role: ${title}\nCompany: ${company}\nLocation: ${location}\nDomain: ${domain}\nEmail: ${email}\n\nDescription:\n${description}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert('Job post copied to clipboard!');
            }).catch(err => {
                console.error('Failed to copy text: ', err);
            });
        }
    </script>
</body>
</html>
