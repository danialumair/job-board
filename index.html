<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>

<body class="bg-gray-50 text-gray-900 font-sans antialiased">

    <!-- Header -->
    <header class="relative bg-indigo-600 text-white py-8 px-4 shadow-md text-center">
        <div class="absolute top-4 right-4">
            <button type="button" onclick="copyCurrentFileJobs()" title="Copy Job Titles & Locations in Current File"
                class="bg-white/10 hover:bg-white/20 text-white p-2.5 rounded-xl backdrop-blur-sm transition-colors border border-white/20 flex items-center justify-center cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
            </button>
        </div>
        <h1 id="headerTitle" class="text-xl sm:text-2xl font-bold tracking-tight mb-1">Global Job Portal</h1>

            “So truly where there is hardship there is also ease.” — Surah Ash-Sharh 94:5
        </p>
    </header>

    <!-- Main Container -->
    <main class="max-w-4xl mx-auto px-4 py-6">

        <!-- Single-File Selector Bar (One File at a Time) -->
        <div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm mb-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3">
            <div class="flex flex-col sm:flex-row sm:items-center gap-2 flex-1">
                <label for="fileSelector" class="text-xs font-semibold text-gray-600 shrink-0">Active Job File:</label>
                <select id="fileSelector" onchange="switchToFile(this.value)"
                    class="px-3 py-2 bg-gray-50 border border-gray-200 rounded-xl text-xs sm:text-sm font-medium text-gray-800 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <option value="jobs_2026-11-23.json">jobs_2026-11-23.json (Built-in / Ready)</option>
                </select>
                <label class="px-3 py-2 bg-indigo-50 hover:bg-indigo-100 text-indigo-700 text-xs font-semibold rounded-xl cursor-pointer transition-colors text-center shrink-0">
                    Load Local JSON
                    <input type="file" id="localJsonInput" accept=".json,application/json" class="hidden" onchange="handleLocalJsonFile(event)">
                </label>
            </div>
            <div id="activeFileInfo" class="text-xs text-gray-500 font-medium"></div>
        </div>

        <!-- Search & Filter Bar (Debounced + Search Button) -->
        <div class="flex flex-col md:flex-row gap-3 mb-5">
            <div class="flex flex-1 gap-2">
                <input type="text" id="searchInput" placeholder="Search title, skills, location, company..."
                    class="w-full px-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <button type="button" id="searchBtn" onclick="applySearchAndFilter()"
                    class="px-5 py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold rounded-xl shadow-sm transition-colors text-sm shrink-0 cursor-pointer">
                    Search
                </button>
            </div>

            <select id="domainFilter"
                class="px-4 py-3 bg-white border border-gray-200 rounded-xl shadow-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                <option value="">All Domains</option>
            </select>
        </div>

        <!-- Job Cards List (All jobs in the single active file, no pagination) -->
        <div id="jobListings" class="space-y-4">
            <p class="text-center text-gray-500 py-8">Loading job file...</p>
        </div>

        <!-- Next File Prompt (Shown when user finishes reviewing the current file) -->
        <div id="nextFilePrompt" class="mt-8 bg-indigo-50 border border-indigo-200 rounded-2xl p-5 text-center hidden">
            <p id="nextFilePromptTitle" class="text-sm sm:text-base font-bold text-indigo-950 mb-1">
                Finished reviewing this file!
            </p>
            <p id="nextFilePromptDesc" class="text-xs sm:text-sm text-indigo-700 mb-4">
                Ready to load the next job file when you are.
            </p>
            <div class="flex flex-wrap items-center justify-center gap-3">
                <button type="button" id="loadNextFileBtn" onclick="loadNextAvailableFile()"
                    class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold rounded-xl shadow-sm transition-colors cursor-pointer">
                    Load Next File →
                </button>
                <label class="px-5 py-2.5 bg-white hover:bg-gray-100 text-indigo-700 border border-indigo-200 text-xs sm:text-sm font-semibold rounded-xl cursor-pointer transition-colors">
                    Choose Another JSON File
                    <input type="file" accept=".json,application/json" class="hidden" onchange="handleLocalJsonFile(event)">
                </label>
            </div>
        </div>

    </main>

alidation Engineering Manager leading a 30+ person semiconductor engineering team in Edinburgh, UK (global search with visa sponsorship and relocation support, plus RSUs and discretionary bonus). Requires hands-on silicon validation and characterization experience, mixed-signal background (audio/power analysis valued), technical or team leadership experience, debugging skills, and Python-based test automation.", "posted_date": "2026-11-23"}];

        const fileDatasets = {
            "jobs_2026-11-23.json": EMBEDDED_JOBS
        };

        let manifestFiles = ["jobs_2026-11-23.json"];
        let currentFileName = "jobs_2026-11-23.json";
        let currentFileJobs = [];
        let searchDebounceTimer = null;

        function escapeHtml(str) {
            return String(str || '')
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function escapeJsSingleQuote(str) {
            return String(str || '')
                .replace(/\/g, '\\')
                .replace(/'/g, "\'")
                .replace(/
?
/g, ' ');
        }

        function normalizeJobs(rawData, fileName) {
            const list = Array.isArray(rawData) ? rawData : (Array.isArray(rawData.jobs) ? rawData.jobs : []);
            const dateMatch = String(fileName || '').match(/\d{4}-\d{2}-\d{2}/);
            const fileDate = dateMatch ? dateMatch[0] : 'Recently';

            return list.map((job, idx) => ({
                ...job,
                unique_id: `${fileName}_${idx}`,
                posted_date: job.posted_date || fileDate
            }));
        }

        async function initPortal() {
            // Load the first/active file immediately so nothing is blocked by fetch errors
            activateFile("jobs_2026-11-23.json");

            // Optionally discover additional files from manifest.json without breaking if missing
            try {
                const manifestRes = await fetch("manifest.json?v=" + Date.now());
                if (manifestRes.ok) {
                    const list = await manifestRes.json();
                    if (Array.isArray(list) && list.length > 0) {
                        const merged = Array.from(new Set([...list, "jobs_2026-11-23.json"]));
                        manifestFiles = merged;
                        rebuildFileSelector();
                        updateNextFilePrompt();
                    }
                }
            } catch (_) {
                // Local/offline mode fallback: built-in file + Load Local JSON button work directly
            }

            try {
                const cfgRes = await fetch("config.json?v=" + Date.now());
                if (cfgRes.ok) {
                    const cfg = await cfgRes.json();
                    if (cfg.header_title && document.getElementById("headerTitle")) {
                        document.getElementById("headerTitle").textContent = cfg.header_title;
                    }
                    if (Array.isArray(cfg.motivational_lines) && cfg.motivational_lines.length > 0) {
                        const idx = Math.floor(Math.random() * cfg.motivational_lines.length);
                        document.getElementById("headerSubtitle").textContent = cfg.motivational_lines[idx];
                    }
                }
            } catch (_) {}
        }

        function rebuildFileSelector() {
            const selector = document.getElementById("fileSelector");
            selector.innerHTML = "";
            manifestFiles.forEach((fname) => {
                const opt = document.createElement("option");
                opt.value = fname;
                opt.textContent = fname === "jobs_2026-11-23.json" ? `${fname} (Built-in)` : fname;
                if (fname === currentFileName) opt.selected = true;
                selector.appendChild(opt);
            });
        }

        // Loads ONLY ONE file at a time into view
        async function activateFile(fileName) {
            currentFileName = fileName;
            document.getElementById("fileSelector").value = fileName;
            document.getElementById("searchInput").value = "";
            document.getElementById("domainFilter").value = "";

            if (fileDatasets[fileName]) {
                currentFileJobs = normalizeJobs(fileDatasets[fileName], fileName);
                finishLoadingCurrentFile();
                return;
            }

            document.getElementById("jobListings").innerHTML = `<p class="text-center text-gray-500 py-8">Loading ${escapeHtml(fileName)}...</p>`;

            try {
                const res = await fetch(fileName + "?v=" + Date.now());
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                fileDatasets[fileName] = data;
                currentFileJobs = normalizeJobs(data, fileName);
                finishLoadingCurrentFile();
            } catch (err) {
                document.getElementById("jobListings").innerHTML = `
                    <div class="bg-amber-50 border border-amber-200 text-amber-800 p-4 rounded-xl text-center text-sm">
                        <p class="font-bold mb-1">Could not fetch "${escapeHtml(fileName)}" automatically.</p>
                        <p>Click <strong>Load Local JSON</strong> above to select your next file, or switch back to <strong>jobs_2026-11-23.json</strong>.</p>
                    </div>`;
                updateNextFilePrompt();
            }
        }

        function finishLoadingCurrentFile() {
            populateDomainFilter(currentFileJobs);
            renderJobs(currentFileJobs);
            document.getElementById("activeFileInfo").textContent = `${currentFileJobs.length} jobs in ${currentFileName}`;
            updateNextFilePrompt();
        }

        function switchToFile(fileName) {
            activateFile(fileName);
        }

        function handleLocalJsonFile(event) {
            const file = event.target.files && event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => {
                try {
                    const parsed = JSON.parse(e.target.result);
                    fileDatasets[file.name] = parsed;
                    if (!manifestFiles.includes(file.name)) {
                        manifestFiles.push(file.name);
                        rebuildFileSelector();
                    }
                    activateFile(file.name);
                } catch (err) {
                    alert("Invalid JSON file: " + err.message);
                }
            };
            reader.readAsText(file);
            event.target.value = "";
        }

        function getNextFileName() {
            const idx = manifestFiles.indexOf(currentFileName);
            if (idx >= 0 && idx + 1 < manifestFiles.length) {
                return manifestFiles[idx + 1];
            }
            return null;
        }

        function updateNextFilePrompt() {
            const promptEl = document.getElementById("nextFilePrompt");
            const titleEl = document.getElementById("nextFilePromptTitle");
            const descEl = document.getElementById("nextFilePromptDesc");
            const nextBtn = document.getElementById("loadNextFileBtn");

            if (!currentFileJobs || currentFileJobs.length === 0) {
                promptEl.classList.add("hidden");
                return;
            }

            promptEl.classList.remove("hidden");
            const nextFile = getNextFileName();
            if (nextFile) {
                titleEl.textContent = `Finished "${currentFileName}" (${currentFileJobs.length} jobs).`;
                descEl.textContent = `Ready to load the next file: ${nextFile}?`;
                nextBtn.classList.remove("hidden");
                nextBtn.textContent = `Load Next File (${nextFile}) →`;
            } else {
                titleEl.textContent = `Finished "${currentFileName}" (${currentFileJobs.length} jobs).`;
                descEl.textContent = "No more files queued—choose another JSON file whenever you're ready for the next one.";
                nextBtn.classList.add("hidden");
            }
        }

        function loadNextAvailableFile() {
            const nextFile = getNextFileName();
            if (nextFile) {
                activateFile(nextFile);
                window.scrollTo({ top: 0, behavior: "smooth" });
            }
        }

        function renderJobs(jobArray) {
            const container = document.getElementById("jobListings");
            container.innerHTML = "";

            if (!jobArray || jobArray.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 py-8">No matching jobs found in this file.</p>`;
                return;
            }

            const fragment = document.createDocumentFragment();

            jobArray.forEach((job) => {
                const title = job.title || "Job Opportunity";
                const company = job.company || "Direct Hiring";
                const domain = job.domain || "General";
                const location = job.location || "Not Specified";
                const description = job.description || job.full_post_content || "";
                const email = job.email || "No email provided";
                const postedDate = job.posted_date || "Recently";
                const cardId = String(job.unique_id || "").replace(/[^a-zA-Z0-9]/g, "_");

                const emailLink = `mailto:${encodeURIComponent(email)}?subject=${encodeURIComponent("Application for " + title)}&body=${encodeURIComponent("Hi,

I would like to apply for the " + title + " position.

Best regards,")}`;

                const wrapper = document.createElement("div");
                wrapper.innerHTML = `
                    <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 hover:shadow-md transition-shadow">
                        <div class="flex justify-between items-start gap-2 mb-2">
                            <div>
                                <h2 class="text-lg font-bold text-gray-900">${escapeHtml(title)}</h2>
                                <p class="text-xs text-gray-500 mt-0.5">${escapeHtml(company)}</p>
                            </div>
                            <div class="flex flex-col items-end gap-1 shrink-0">
                                <span class="px-3 py-1 bg-indigo-50 text-indigo-700 text-xs font-semibold rounded-full">${escapeHtml(domain)}</span>
                                <span class="text-[11px] text-gray-400 font-medium cursor-pointer hover:text-indigo-600" title="Click to copy job post"
                                    onclick="copyJobPost('${escapeJsSingleQuote(title)}', '${escapeJsSingleQuote(company)}', '${escapeJsSingleQuote(location)}', '${escapeJsSingleQuote(domain)}', '${escapeJsSingleQuote(email)}', '${escapeJsSingleQuote(description)}')">📅 ${escapeHtml(postedDate)}</span>
                            </div>
                        </div>
                        <div class="flex flex-wrap items-center gap-4 text-xs text-gray-500 mb-3">
                            <span>📍 ${escapeHtml(location)}</span>
                            <span>✉️ ${escapeHtml(email)}</span>
                        </div>

                        <div>
                            <p id="desc_${cardId}" class="text-sm text-gray-600 mb-3 line-clamp-3 transition-all duration-300">
                                ${escapeHtml(description)}
                            </p>
                            <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-gray-100">
                                <button type="button" onclick="toggleReadMore('${cardId}')" id="btn_${cardId}"
                                    class="text-xs font-semibold text-indigo-600 hover:text-indigo-800 focus:outline-none cursor-pointer">
                                    Read More ↓
                                </button>

                                <a href="${emailLink}"
                                    class="bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-semibold py-2 px-5 rounded-xl transition-colors">
                                    Apply via Email
                                </a>
                            </div>
                        </div>
                    </div>
                `;
                fragment.appendChild(wrapper.firstElementChild);
            });

            container.appendChild(fragment);
        }

        function toggleReadMore(cardId) {
            const descElem = document.getElementById(`desc_${cardId}`);
            const btnElem = document.getElementById(`btn_${cardId}`);
            if (descElem.classList.contains("line-clamp-3")) {
                descElem.classList.remove("line-clamp-3");
                btnElem.textContent = "Read Less ↑";
            } else {
                descElem.classList.add("line-clamp-3");
                btnElem.textContent = "Read More ↓";
            }
        }

        const searchInputEl = document.getElementById("searchInput");
        const domainFilterEl = document.getElementById("domainFilter");

        searchInputEl.addEventListener("input", () => {
            clearTimeout(searchDebounceTimer);
            searchDebounceTimer = setTimeout(applySearchAndFilter, SEARCH_DEBOUNCE_MS);
        });

        searchInputEl.addEventListener("keydown", (e) => {
            if (e.key === "Enter") {
                clearTimeout(searchDebounceTimer);
                applySearchAndFilter();
            }
        });

        domainFilterEl.addEventListener("change", () => {
            clearTimeout(searchDebounceTimer);
            applySearchAndFilter();
        });

        function applySearchAndFilter() {
            const query = searchInputEl.value.trim().toLowerCase();
            const domain = domainFilterEl.value;

            const filtered = currentFileJobs.filter((job) => {
                const matchesQuery = !query ||
                    (job.title || "").toLowerCase().includes(query) ||
                    (job.location || "").toLowerCase().includes(query) ||
                    (job.description || "").toLowerCase().includes(query) ||
                    (job.company || "").toLowerCase().includes(query);
                const matchesDomain = domain === "" || (job.domain || "").trim() === domain;
                return matchesQuery && matchesDomain;
            });

            renderJobs(filtered);
        }

        function copyJobPost(title, company, location, domain, email, description) {
            const textToCopy = `Title: ${title}
Company: ${company}
Location: ${location}
Domain: ${domain}
Email: ${email}

Description:
${description}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("Job post copied to clipboard!");
            }).catch((err) => {
                console.error("Failed to copy text: ", err);
            });
        }

        function copyCurrentFileJobs() {
            const currentUrl = window.location.href;
            if (!currentFileJobs || currentFileJobs.length === 0) {
                alert("No jobs loaded in the current file!");
                return;
            }

            let textToCopy = `Jobs (${currentFileName}) : @ ${currentUrl}

`;
            currentFileJobs.forEach((job, index) => {
                const title = job.title || "Job Opportunity";
                const location = job.location || "Not Specified";
                textToCopy += location && location.toLowerCase() !== "not specified"
                    ? `${index + 1}. ${title} — ${location}
`
                    : `${index + 1}. ${title}
`;
            });
            textToCopy += `
🔗 Apply & Browse More: ${currentUrl}`;

            navigator.clipboard.writeText(textToCopy).then(() => {
                alert("Jobs from current file copied to clipboard!");
            }).catch((err) => {
                console.error("Failed to copy text: ", err);
            });
        }

        function populateDomainFilter(jobs) {
            const domainSelect = document.getElementById("domainFilter");
            domainSelect.innerHTML = '<option value="">All Domains</option>';

            const uniqueDomains = [...new Set(
                jobs
                    .map((job) => (job.domain || "").trim())
                    .filter((d) => d !== "")
            )].sort((a, b) => a.localeCompare(b));

            uniqueDomains.forEach((domain) => {
                const option = document.createElement("option");
                option.value = domain;
                option.textContent = domain;
                domainSelect.appendChild(option);
            });
        }

        initPortal();
    </script>
</body>

</html>
