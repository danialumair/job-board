<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tech &amp; Telecom Jobs Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --pill-bg: #f1f5f9;
      --whatsapp: #25D366;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --shadow-lg: 0 20px 40px -10px rgba(15, 23, 42, 0.2);
      --radius-lg: 20px;
      --radius-md: 12px;
      --radius-pill: 9999px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    /* Header & Search */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 20px 16px;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    .header-top {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .header-top h1 {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-main);
    }

    .job-count {
      font-size: 0.875rem;
      color: var(--text-muted);
      background: var(--pill-bg);
      padding: 4px 12px;
      border-radius: var(--radius-pill);
      font-weight: 500;
    }

    .filters {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 640px) {
      .filters {
        grid-template-columns: 2fr 1fr 1fr;
      }
    }

    .filters input,
    .filters select {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 0.9rem;
      font-family: inherit;
      background: var(--surface);
      color: var(--text-main);
      outline: none;
      transition: border-color 0.15s;
    }

    .filters input:focus,
    .filters select:focus {
      border-color: var(--primary);
    }

    /* Job Grid */
    main {
      padding: 24px 16px 60px;
    }

    .jobs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }

    @media (min-width: 768px) {
      .jobs-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .job-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 14px;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
    }

    .job-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
      border-color: #cbd5e1;
    }

    .card-header {
      display: flex;
      align-items: flex-start;
      gap: 12px;
    }

    .company-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid #dbeafe;
    }

    .card-title-group {
      flex: 1;
      min-width: 0;
    }

    .card-title {
      font-size: 1.02rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 3px;
      line-height: 1.35;
    }

    .card-meta {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .pills-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .pill {
      font-size: 0.76rem;
      font-weight: 500;
      color: #475569;
      background: var(--pill-bg);
      padding: 4px 10px;
      border-radius: var(--radius-pill);
    }

    .card-excerpt {
      font-size: 0.87rem;
      color: #475569;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding-top: 10px;
      border-top: 1px solid #f1f5f9;
    }

    .posted-date {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .btn-group {
      display: flex;
      gap: 8px;
    }

    .btn-view {
      background: var(--primary);
      color: #ffffff;
      border: none;
      padding: 8px 16px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-view:hover {
      background: var(--primary-hover);
    }

    .btn-card-share {
      background: var(--pill-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
    }

    .btn-card-share:hover {
      background: #e2e8f0;
    }

    /* =========================================================
       POPUP MODAL (Matches Screenshot Design)
       ========================================================= */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.55);
      backdrop-filter: blur(3px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
      opacity: 0;
      transition: opacity 0.2s ease;
    }

    .modal-backdrop.open {
      display: flex;
      opacity: 1;
    }

    .modal-sheet {
      background: var(--surface);
      width: 100%;
      max-width: 520px;
      max-height: 90vh;
      border-radius: 26px;
      box-shadow: var(--shadow-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      position: relative;
      animation: slideUp 0.22s ease-out;
    }

    @keyframes slideUp {
      from {
        transform: translateY(24px);
        opacity: 0.7;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    /* Top Bar with Circular Back/Close & Share Buttons */
    .modal-topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px 10px;
      background: var(--surface);
      flex-shrink: 0;
    }

    .circle-icon-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-main);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.05);
      transition: background 0.15s, transform 0.1s;
    }

    .circle-icon-btn:hover {
      background: var(--pill-bg);
    }

    .circle-icon-btn:active {
      transform: scale(0.95);
    }

    /* Scrollable Body */
    .modal-body {
      padding: 8px 22px 100px;
      overflow-y: auto;
      flex: 1;
    }

    .modal-job-header {
      display: flex;
      align-items: flex-start;
      gap: 14px;
      margin-bottom: 14px;
    }

    .modal-avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--primary-light);
      color: var(--primary);
      font-weight: 700;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      border: 1px solid #dbeafe;
    }

    .modal-title-wrap {
      flex: 1;
    }

    .modal-title {
      font-size: 1.22rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.3;
      margin-bottom: 4px;
    }

    .modal-subtitle {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .modal-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 20px;
      padding-bottom: 18px;
      border-bottom: 1px solid var(--border);
    }

    .modal-section-title {
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    .modal-description {
      font-size: 0.93rem;
      color: #334155;
      line-height: 1.65;
      white-space: pre-line;
      margin-bottom: 20px;
    }

    .modal-contact-box {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      font-size: 0.88rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .modal-contact-box a {
      color: var(--primary);
      font-weight: 600;
      text-decoration: none;
      word-break: break-all;
    }

    /* Sticky Bottom Apply Bar */
    .modal-footer {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 14px 20px 18px;
      background: linear-gradient(to top, #ffffff 80%, rgba(255, 255, 255, 0));
      display: flex;
      gap: 10px;
    }

    .btn-apply-pill {
      flex: 1;
      background: #3b82f6;
      color: #ffffff;
      border: none;
      border-radius: var(--radius-pill);
      padding: 14px 24px;
      font-size: 1rem;
      font-weight: 600;
      text-align: center;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.35);
      transition: background 0.15s, transform 0.1s;
    }

    .btn-apply-pill:hover {
      background: var(--primary);
    }

    /* Share Popover Menu inside Modal */
    .share-menu {
      position: absolute;
      top: 64px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 12px 30px rgba(15, 23, 42, 0.16);
      padding: 8px;
      width: 225px;
      z-index: 120;
      display: none;
      flex-direction: column;
      gap: 4px;
    }

    .share-menu.open {
      display: flex;
    }

    .share-option {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      background: transparent;
      color: var(--text-main);
      font-size: 0.88rem;
      font-weight: 500;
      font-family: inherit;
      text-decoration: none;
      cursor: pointer;
      text-align: left;
      transition: background 0.12s;
    }

    .share-option:hover {
      background: var(--pill-bg);
    }

    .share-option.whatsapp {
      color: #15803d;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      font-size: 0.86rem;
      font-weight: 500;
      z-index: 200;
      opacity: 0;
      transition: transform 0.25s ease, opacity 0.25s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body>

  <header>
    <div class="container">
      <div class="header-top">
        <h1>Global Tech &amp; Telecom Jobs</h1>
        <span class="job-count" id="jobCount">Loading jobs...</span>
      </div>
      <div class="filters">
        <input type="text" id="searchInput" placeholder="Search role, skill, company, or location..." />
        <select id="domainFilter">
          <option value="">All Domains</option>
        </select>
        <select id="dateFilter">
          <option value="">All Dates</option>
        </select>
      </div>
    </div>
  </header>

  <main class="container">
    <div class="jobs-grid" id="jobsGrid"></div>
  </main>

  <!-- JOB DETAILS POPUP MODAL -->
  <div class="modal-backdrop" id="jobModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-sheet">
      <!-- Top Navigation Bar (Close / Back on left, Share on right) -->
      <div class="modal-topbar">
        <button type="button" class="circle-icon-btn" id="modalCloseBtn" title="Close" aria-label="Close job details">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"></polyline>
          </svg>
        </button>

        <button type="button" class="circle-icon-btn" id="modalShareBtn" title="Share job" aria-label="Share job">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"></circle>
            <circle cx="6" cy="12" r="3"></circle>
            <circle cx="18" cy="19" r="3"></circle>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
            <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
          </svg>
        </button>
      </div>

      <!-- Share Dropdown Menu -->
      <div class="share-menu" id="shareMenu">
        <a href="#" target="_blank" rel="noopener" class="share-option whatsapp" id="shareWhatsApp">
          <span>💬</span> Share via WhatsApp
        </a>
        <a href="#" target="_blank" rel="noopener" class="share-option" id="shareLinkedIn">
          <span>💼</span> Share on LinkedIn
        </a>
        <a href="#" class="share-option" id="shareEmail">
          <span>✉️</span> Share via Email
        </a>
        <button type="button" class="share-option" id="shareCopyBtn">
          <span>📋</span> Copy Details &amp; Link
        </button>
        <button type="button" class="share-option" id="shareNativeBtn" style="display:none;">
          <span>📤</span> More Share Options...
        </button>
      </div>

      <!-- Scrollable Content -->
      <div class="modal-body">
        <div class="modal-job-header">
          <div class="modal-avatar" id="modalAvatar">J</div>
          <div class="modal-title-wrap">
            <h2 class="modal-title" id="modalTitle">Job Title</h2>
            <div class="modal-subtitle" id="modalSubtitle">Company • Location</div>
          </div>
        </div>

        <div class="modal-pills" id="modalPills"></div>

        <h3 class="modal-section-title">About this role</h3>
        <div class="modal-description" id="modalDescription"></div>

        <div class="modal-contact-box">
          <span>Recruiter Email:</span>
          <a href="#" id="modalEmailLink">email@company.com</a>
        </div>
      </div>

      <!-- Bottom Sticky Apply Button -->
      <div class="modal-footer">
        <a href="#" class="btn-apply-pill" id="modalApplyBtn">Apply this job</a>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">Link &amp; job details copied!</div>

  <script>
    let allJobs = [];
    let activeJob = null;

    const jobsGrid = document.getElementById('jobsGrid');
    const jobCount = document.getElementById('jobCount');
    const searchInput = document.getElementById('searchInput');
    const domainFilter = document.getElementById('domainFilter');
    const dateFilter = document.getElementById('dateFilter');

    // Modal elements
    const jobModal = document.getElementById('jobModal');
    const modalCloseBtn = document.getElementById('modalCloseBtn');
    const modalShareBtn = document.getElementById('modalShareBtn');
    const shareMenu = document.getElementById('shareMenu');
    const toast = document.getElementById('toast');

    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2600);
    }

    // Build deep link URL for a specific job without page reload
    function getJobShareUrl(jobId) {
      const url = new URL(window.location.href);
      url.searchParams.set('job', jobId);
      return url.toString();
    }

    // Build formatted share message containing job details + direct URL
    function buildShareText(job) {
      const url = getJobShareUrl(job.id);
      const shortDesc = (job.description || '').replace(/\s+/g, ' ').trim().slice(0, 180);
      return [
        `🚀 *${job.title}*`,
        `🏢 Company: ${job.company}`,
        `📍 Location: ${job.location}`,
        `🏷️ Domain: ${job.domain}`,
        job.email ? `📧 Apply Email: ${job.email}` : '',
        shortDesc ? `
📝 ${shortDesc}...` : '',
        `
🔗 View full job details:
${url}`
      ].filter(Boolean).join('
');
    }

    // Open popup modal & update URL via history.pushState (NO page refresh)
    function openJobModal(job, updateUrl = true) {
      if (!job) return;
      activeJob = job;

      document.getElementById('modalAvatar').textContent = (job.company || 'J').charAt(0).toUpperCase();
      document.getElementById('modalTitle').textContent = job.title;
      document.getElementById('modalSubtitle').textContent = `${job.company} • ${job.location}`;
      document.getElementById('modalDescription').textContent = job.description || 'No additional description provided.';

      // Pills
      const pillsEl = document.getElementById('modalPills');
      pillsEl.innerHTML = `
        <span class="pill">${job.domain || 'Telecom & IT'}</span>
        <span class="pill">${job.location}</span>
        <span class="pill">Posted: ${job.posted_date}</span>
        <span class="pill">${job.id}</span>
      `;

      // Email & Apply link
      const emailLink = document.getElementById('modalEmailLink');
      const applyBtn = document.getElementById('modalApplyBtn');
      if (job.email) {
        emailLink.textContent = job.email;
        emailLink.href = `mailto:${job.email}`;
        const subject = encodeURIComponent(`Application for ${job.title} (${job.id})`);
        const body = encodeURIComponent(`Hello,

I would like to apply for the ${job.title} position at ${job.company} (${job.location}).

Please find my resume attached.

Best regards,`);
        applyBtn.href = `mailto:${job.email}?subject=${subject}&body=${body}`;
        applyBtn.style.display = 'block';
      } else {
        emailLink.textContent = 'Not specified';
        emailLink.removeAttribute('href');
        applyBtn.style.display = 'none';
      }

      // Configure share links
      const shareText = buildShareText(job);
      const shareUrl = getJobShareUrl(job.id);
      document.getElementById('shareWhatsApp').href = `https://api.whatsapp.com/send?text=${encodeURIComponent(shareText)}`;
      document.getElementById('shareLinkedIn').href = `https://www.linkedin.com/sharing/share-offsite/?url=${encodeURIComponent(shareUrl)}`;
      document.getElementById('shareEmail').href = `mailto:?subject=${encodeURIComponent(`Job Opportunity: ${job.title} - ${job.company}`)}&body=${encodeURIComponent(shareText)}`;

      if (navigator.share) {
        document.getElementById('shareNativeBtn').style.display = 'flex';
      }

      // Update browser URL without refreshing
      if (updateUrl) {
        const nextUrl = new URL(window.location.href);
        nextUrl.searchParams.set('job', job.id);
        window.history.pushState({ jobId: job.id }, '', nextUrl);
      }

      shareMenu.classList.remove('open');
      jobModal.classList.add('open');
      document.body.style.overflow = 'hidden';
    }

    // Close popup modal & clean URL parameter without refreshing
    function closeJobModal(updateUrl = true) {
      jobModal.classList.remove('open');
      shareMenu.classList.remove('open');
      document.body.style.overflow = '';
      activeJob = null;

      if (updateUrl) {
        const cleanUrl = new URL(window.location.href);
        cleanUrl.searchParams.delete('job');
        window.history.pushState({}, '', cleanUrl);
      }
    }

    // Modal event listeners
    modalCloseBtn.addEventListener('click', () => closeJobModal(true));

    jobModal.addEventListener('click', (e) => {
      if (e.target === jobModal) closeJobModal(true);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && jobModal.classList.contains('open')) {
        closeJobModal(true);
      }
    });

    // Toggle share dropdown inside modal
    modalShareBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      shareMenu.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!shareMenu.contains(e.target) && e.target !== modalShareBtn) {
        shareMenu.classList.remove('open');
      }
    });

    // Copy job details + URL to clipboard
    document.getElementById('shareCopyBtn').addEventListener('click', async () => {
      if (!activeJob) return;
      const text = buildShareText(activeJob);
      try {
        await navigator.clipboard.writeText(text);
        showToast('Job details & direct URL copied!');
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast('Job details & direct URL copied!');
      }
      shareMenu.classList.remove('open');
    });

    // Native mobile Web Share API (WhatsApp, Telegram, SMS, etc.)
    document.getElementById('shareNativeBtn').addEventListener('click', async () => {
      if (!activeJob || !navigator.share) return;
      try {
        await navigator.share({
          title: `${activeJob.title} - ${activeJob.company}`,
          text: buildShareText(activeJob),
          url: getJobShareUrl(activeJob.id)
        });
      } catch (err) {
        // User cancelled share sheet
      }
      shareMenu.classList.remove('open');
    });

    // Handle browser Back/Forward buttons smoothly
    window.addEventListener('popstate', () => {
      const params = new URLSearchParams(window.location.search);
      const jobId = params.get('job');
      if (jobId) {
        const found = allJobs.find(j => j.id.toLowerCase() === jobId.toLowerCase());
        if (found) openJobModal(found, false);
      } else {
        closeJobModal(false);
      }
    });

    // Render job cards
    function renderJobs(jobs) {
      jobCount.textContent = `${jobs.length} Job${jobs.length === 1 ? '' : 's'}`;
      if (!jobs.length) {
        jobsGrid.innerHTML = '<p style="color:#64748b;grid-column:1/-1;text-align:center;padding:40px 0;">No matching jobs found.</p>';
        return;
      }

      jobsGrid.innerHTML = jobs.map(job => `
        <article class="job-card">
          <div>
            <div class="card-header">
              <div class="company-avatar">${(job.company || 'J').charAt(0).toUpperCase()}</div>
              <div class="card-title-group">
                <h2 class="card-title">${escapeHtml(job.title)}</h2>
                <div class="card-meta">${escapeHtml(job.company)} • ${escapeHtml(job.location)}</div>
              </div>
            </div>
            <div class="pills-row" style="margin-top:12px;">
              <span class="pill">${escapeHtml(job.domain || 'Telecom')}</span>
              <span class="pill">${escapeHtml(job.id)}</span>
            </div>
            <p class="card-excerpt" style="margin-top:10px;">${escapeHtml(job.description || '')}</p>
          </div>

          <div class="card-actions">
            <span class="posted-date">Posted ${escapeHtml(job.posted_date)}</span>
            <div class="btn-group">
              <button type="button" class="btn-card-share" title="Share via WhatsApp / Copy Link" onclick="quickShare('${escapeHtml(job.id)}')">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="18" cy="5" r="3"></circle>
                  <circle cx="6" cy="12" r="3"></circle>
                  <circle cx="18" cy="19" r="3"></circle>
                  <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
                  <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>
                </svg>
              </button>
              <button type="button" class="btn-view" onclick="openJobById('${escapeHtml(job.id)}')">View Details</button>
            </div>
          </div>
        </article>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.openJobById = function(jobId) {
      const job = allJobs.find(j => j.id === jobId);
      if (job) openJobModal(job, true);
    };

    window.quickShare = function(jobId) {
      const job = allJobs.find(j => j.id === jobId);
      if (!job) return;
      openJobModal(job, true);
      shareMenu.classList.add('open');
    };

    function applyFilters() {
      const q = searchInput.value.toLowerCase().trim();
      const domain = domainFilter.value;
      const date = dateFilter.value;

      const filtered = allJobs.filter(job => {
        const matchesQuery = !q ||
          (job.title && job.title.toLowerCase().includes(q)) ||
          (job.company && job.company.toLowerCase().includes(q)) ||
          (job.location && job.location.toLowerCase().includes(q)) ||
          (job.description && job.description.toLowerCase().includes(q));
        const matchesDomain = !domain || job.domain === domain;
        const matchesDate = !date || job.posted_date === date;
        return matchesQuery && matchesDomain && matchesDate;
      });

      renderJobs(filtered);
    }

    searchInput.addEventListener('input', applyFilters);
    domainFilter.addEventListener('change', applyFilters);
    dateFilter.addEventListener('change', applyFilters);

    // Load JSON data & check URL parameter (?job=JOB-001) on initial load
    async function init() {
      try {
        const res = await fetch('jobs_portal_merged.json');
        allJobs = await res.json();

        // Populate filters
        const domains = [...new Set(allJobs.map(j => j.domain).filter(Boolean))].sort();
        domains.forEach(d => {
          const opt = document.createElement('option');
          opt.value = d;
          opt.textContent = d;
          domainFilter.appendChild(opt);
        });

        const dates = [...new Set(allJobs.map(j => j.posted_date).filter(Boolean))].sort().reverse();
        dates.forEach(dt => {
          const opt = document.createElement('option');
          opt.value = dt;
          opt.textContent = dt;
          dateFilter.appendChild(opt);
        });

        renderJobs(allJobs);

        // If user opened a shared link like ?job=JOB-005, open that job popup automatically
        const params = new URLSearchParams(window.location.search);
        const sharedJobId = params.get('job');
        if (sharedJobId) {
          const targetJob = allJobs.find(j => j.id.toLowerCase() === sharedJobId.toLowerCase());
          if (targetJob) {
            openJobModal(targetJob, false);
          }
        }
      } catch (err) {
        jobsGrid.innerHTML = '<p style="color:#ef4444;text-align:center;padding:40px 0;">Failed to load jobs_portal_merged.json. Make sure it is in the same folder as index.html.</p>';
        console.error(err);
      }
    }

    init();
  </script>
</body>
</html>
